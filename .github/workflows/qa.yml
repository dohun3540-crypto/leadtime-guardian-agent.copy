name: Independent QA
on:
  push:
    branches: [feat/independent-qa-integration, feat/qa-source-restore-20261031, feat/qa-sandbox-copy-validation-20261101, feat/qa-team2-v6-combined-20261101]
  pull_request:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          if test -f requirements-agents.txt; then
            python -m pip install -r requirements-agents.txt
          else
            python -m pip install pytest ruff
          fi
      - run: PYTHONPATH=src python -m pytest -q tests/test_qa_*.py
      - run: python -m ruff check src/leadtime_guardian/qa scripts/qa_*.py tests/test_qa_*.py
      - name: Full Python regression (code only; no Studio live execution)
        run: PYTHONPATH=src python -m pytest -q
      - name: Repository-wide Ruff
        run: python -m ruff check .
      - name: Verify immutable C001 archive when available
        run: |
          if test -f data/results/studio_runs/C001_20261030_v4/execution_record.json; then
            python scripts/qa_archive_check.py --root .
          fi
      - name: Execute conservative local integration gate
        run: |
          if test -f scripts/qa_gate_check.py && test -f data/results/studio_runs/C001_20261030_v4/execution_record.json; then
            python scripts/qa_gate_check.py --root .
          fi
